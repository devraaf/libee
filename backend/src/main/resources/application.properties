spring.application.name=backend

# Perfil de desenvolvimento ativo
spring.profiles.active=local

# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5433/libee

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#APIs externas de consulta dados de livros
libee.integrations.google-books.base-url=https://www.googleapis.com/books/v1
libee.integrations.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
libee.integrations.google-books.connect-timeout=4s
libee.integrations.google-books.read-timeout=2s

libee.integrations.open-library.base-url=https://openlibrary.org
libee.integrations.open-library.connect-timeout=4s
libee.integrations.open-library.read-timeout=2s

#JWT
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=2h
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Configurações do Hibernate para atualizar o esquema automaticamente no MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Desativa o Flyway temporariamente para evitar conflitos de versão com o MySQL
spring.flyway.enabled=false
